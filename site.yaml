---
- name: Upgrade operating system
  hosts: servers
  serial: 1
  roles:
    - role: upgrade
      tags: [upgrade, never]
- name: Deploy common components
  hosts: servers
  roles:
    - role: common
      tags: common
    - role: zabbix-agent
      tags: zabbix-agent
    - role: sys-agent
      tags: sys-agent
    - role: iperf3
      tags: iperf3
    - role: reproxy
      tags: reproxy
    - role: dufs
      tags: dufs
- name: Deploy helium-specific components
  hosts: helium
  roles:
    - role: cronn
      tags: cronn
    - role: postgresql
      tags: postgresql
    - role: grafana
      tags: grafana
    - role: zabbix-server
      tags: zabbix
    - role: zabbix-web
      tags: zabbix
    - role: powerdns
      tags: powerdns
    - role: mongodb
      tags: mongodb
    - role: ollama
      tags: ollama
    - role: adguard
      tags: adguard
    - role: home-assistant
      tags: home-assistant
    - role: prometheus
      tags: prometheus
    - role: transit-alert
      tags: transit-alert
    - role: gitea
      tags: gitea
    - role: gitea-runner
      tags: gitea-runner
    - role: wealthfolio
      tags: wealthfolio
- name: Deploy neon-specific components
  hosts: neon
  roles:
    - role: watchdog
      tags: watchdog
- name: Deploy xenon-specific components
  hosts: xenon
  roles:
    - role: wireguard-client
      tags: wireguard-client
