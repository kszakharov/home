---
- name: Check that dpkg is in a clean state
  command: dpkg --audit
  register: upgrade_dpkg_audit
  changed_when: false
  failed_when: upgrade_dpkg_audit.stdout | length > 0
  check_mode: false

- name: Read installed release codename
  shell: . /etc/os-release && echo "$VERSION_CODENAME"
  register: upgrade_installed_release
  changed_when: false
  check_mode: false

- name: Upgrade packages within the current release
  apt:
    update_cache: true
    upgrade: dist
    autoremove: true
    lock_timeout: 300

- name: Upgrade to the release set in the inventory ({{ os_codename }})
  when: upgrade_installed_release.stdout != os_codename
  block:
    - name: Install do-release-upgrade (Ubuntu)
      apt:
        name: update-manager-core
        lock_timeout: 300
      when: ansible_facts.distribution == 'Ubuntu'

    - name: Run release upgrade (Ubuntu)
      command: do-release-upgrade -m server -f DistUpgradeViewNonInteractive
      register: upgrade_ubuntu
      changed_when: true
      when: ansible_facts.distribution == 'Ubuntu'

    - name: Show release upgrade output (Ubuntu)
      debug:
        msg: "{{ upgrade_ubuntu.stdout_lines[-30:] }}"
      when: ansible_facts.distribution == 'Ubuntu'

    - name: Find apt source files (Debian/Raspbian)
      find:
        paths: /etc/apt
        patterns: ["*.list", "*.sources"]
        recurse: true
      register: upgrade_apt_sources
      when: ansible_facts.distribution != 'Ubuntu'

    - name: Point apt sources to the new release (Debian/Raspbian)
      replace:
        path: "{{ item.path }}"
        regexp: '\b{{ upgrade_installed_release.stdout }}\b'
        replace: "{{ os_codename }}"
      loop: "{{ upgrade_apt_sources.files }}"
      loop_control:
        label: "{{ item.path }}"
      when: ansible_facts.distribution != 'Ubuntu'

    # apt-get is used instead of the apt module on purpose: dpkg is then driven
    # by a C++ binary, not by a Python process that is being upgraded.
    - name: Run release upgrade (Debian/Raspbian)
      shell: |
        set -e
        apt-get update
        apt-get -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold upgrade
        apt-get -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold dist-upgrade
        apt-get -y autoremove
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: upgrade_debian
      changed_when: true
      when: ansible_facts.distribution != 'Ubuntu'

    - name: Show release upgrade output (Debian/Raspbian)
      debug:
        msg: "{{ upgrade_debian.stdout_lines[-30:] }}"
      when: ansible_facts.distribution != 'Ubuntu'

- name: Forget the discovered Python interpreter
  meta: clear_facts
  when: upgrade_installed_release.stdout != os_codename

- name: Check if a reboot is required
  stat:
    path: /var/run/reboot-required
  register: upgrade_reboot_file

- name: Reboot
  reboot:
    reboot_timeout: 1200
  when: upgrade_reboot_file.stat.exists or upgrade_installed_release.stdout != os_codename

- name: Read release codename after upgrade
  shell: . /etc/os-release && echo "$VERSION_CODENAME"
  register: upgrade_final_release
  changed_when: false
  check_mode: false
  when: upgrade_installed_release.stdout != os_codename

- name: Fail if the release did not change
  assert:
    that: upgrade_final_release.stdout == os_codename
    fail_msg: "Expected {{ os_codename }} but the host is on {{ upgrade_final_release.stdout }}"
  when: upgrade_installed_release.stdout != os_codename

- name: Refresh cached facts after release upgrade
  setup:
  when: upgrade_installed_release.stdout != os_codename
