---
- name: Remove legacy docker apt repo file
  file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Remove legacy docker apt key
  apt_key:
    url: https://download.docker.com/linux/{{ ansible_facts.lsb.id | lower }}/gpg
    state: absent

- name: Add Docker GPG apt key and repository
  deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts.lsb.id | lower }}"
    suites: "{{ ansible_facts.lsb.codename }}"
    components: stable
    architectures: "{{ apt_repo_arch }}"
    signed_by: "https://download.docker.com/linux/{{ ansible_facts.lsb.id | lower }}/gpg"
    install_python_debian: true
    state: present

- name: Update apt and install docker-ce
  apt:
    name: docker-ce
    state: latest
    update_cache: true

- name: Create a /data directory
  file:
    path: /data
    state: directory
    owner: root
    group: "{{ autouser.name }}"
    mode: "0775"
