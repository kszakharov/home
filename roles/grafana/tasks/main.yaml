---
- name: Create grafana directories
  file:
    path: /data/grafana
    state: directory
    owner: "{{ autouser.name }}"
    group: "{{ autouser.name }}"
    mode: "0775"

- name: Start a grafana container
  docker_container:
    name: grafana
    image: grafana/grafana:13.2.2-distroless
    state: started
    restart_policy: unless-stopped
    user: "{{ autouser.uid }}"
    volumes:
      - /data/grafana:/var/lib/grafana
    dns_servers:
      - "{{ dns }}"
    dns_search_domains:
      - home
    env:
      GF_SERVER_ROOT_URL: "http://{{ ansible_facts['hostname'] }}/grafana"
  notify: Restart reproxy
