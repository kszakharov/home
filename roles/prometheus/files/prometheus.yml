global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: reproxy
    metrics_path: /metrics
    static_configs:
      - targets:
        - helium
        - neon
        - xenon
  - job_name: edgerouter
    static_configs:
      - targets: ['krypton:9100']
        labels:
          instance: krypton
