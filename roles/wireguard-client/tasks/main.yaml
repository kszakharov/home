---
- name: Install WireGuard packages
  package:
    name: wireguard
    state: present
  tags: dependencies

- name: Create WireGuard configuration
  template:
    src: wg.conf.j2
    dest: /etc/wireguard/{{ networks.vpn.dev }}.conf
    mode: "0600"
  notify: Restart WireGuard

- name: Enable WireGuard service
  systemd_service:
    name: wg-quick@{{ networks.vpn.dev }}
    enabled: true
    state: started
