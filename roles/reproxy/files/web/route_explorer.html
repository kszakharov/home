<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Route Explorer</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <header class="tall">
        <h1>Route Explorer</h1>
        <div class="subtitle">
            Discover and search routes from all configured servers
        </div>
    </header>

    <main>
        <!-- Overlaps the header strip, same as the dashboard nav -->
        <nav class="overhead">
            <ul id="chips">
                <li class="button button-nav static"><a><strong id="visible-count">0</strong><span
                            class="label">shown</span></a></li>
                <li class="button button-nav static"><a><strong id="total-count">0</strong><span
                            class="label">routes</span></a></li>
                <li class="button button-nav static"><a><strong id="server-count">0</strong><span
                            class="label">servers</span></a></li>
                <li class="button button-nav static"><a><span class="label">updated</span><strong
                            id="updated">&mdash;</strong></a></li>
                <!-- server filter chips are added here by the script below -->
            </ul>
        </nav>

        <div class="explorer">
            <div class="error-box" id="error-box"></div>

            <div class="search-bar">
                <div class="search-wrapper">
                    <span class="search-icon">⌕</span>

                    <input id="search" type="search" autocomplete="off" spellcheck="false"
                        placeholder="Search routes, servers, IPs, ports, providers..." />

                    <span class="kbd">Ctrl K</span>
                    <button id="clear-search" title="Clear search">×</button>
                </div>

                <button class="button refresh-action" id="refresh" title="Reload routes from all servers">
                    <span class="spin">↻</span> Refresh
                </button>
            </div>

            <!-- Overlaps the footer strip, same as the dashboard server cards -->
            <div class="server-stats-container overfoot">
                <div class="server-stats table-card">
                    <div class="loading" id="loading">
                        <div class="skeleton-row"></div>
                        <div class="skeleton-row"></div>
                        <div class="skeleton-row"></div>
                        <div class="skeleton-row"></div>
                        <div class="skeleton-row"></div>
                        <div class="skeleton-row"></div>
                    </div>

                    <table id="routes-table" style="display:none">
                        <thead>
                            <tr>
                                <th data-key="server">Server</th>
                                <th data-key="route">Route</th>
                                <th data-key="destination">Destination</th>
                                <th data-key="match">Match</th>
                                <th data-key="provider">Provider</th>
                                <th data-key="ping">Ping</th>
                            </tr>
                        </thead>

                        <tbody id="routes-body"></tbody>
                    </table>

                    <div class="error-message" id="empty" style="display:none">
                        <h2>No matching routes</h2>
                        <p>Try a different search term or server filter.</p>
                        <div class="centered-button-container">
                            <div class="button button-nav"><a href="#" id="reset-filters">Clear filters</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 My HomeLab</p>
    </footer>

    <div class="toast" id="toast"></div>

    <script>
        /*
         * ============================================================
         * CONFIGURATION
         * ============================================================
         */

        const SERVER_URLS = [
            "http://helium/routes",
            "http://neon/routes",
            "http://xenon/routes"
        ];

        const SERVER_COLORS = [
            "#3498db", "#27ae60", "#8e44ad",
            "#e67e22", "#16a085", "#c0392b"
        ];


        /*
         * ============================================================
         * STATE
         * ============================================================
         */

        let allRoutes = [];
        let serverResults = [];

        // Source URLs currently used as a filter (empty = all servers).
        const activeSources = new Set();

        // Sorting: key + direction (1 asc, -1 desc). null = server order.
        let sortKey = null;
        let sortDir = 1;


        /*
         * ============================================================
         * DOM
         * ============================================================
         */

        const searchInput = document.getElementById("search");
        const clearSearch = document.getElementById("clear-search");
        const refreshButton = document.getElementById("refresh");
        const resetButton = document.getElementById("reset-filters");

        const routesTable = document.getElementById("routes-table");
        const routesBody = document.getElementById("routes-body");

        const loading = document.getElementById("loading");
        const empty = document.getElementById("empty");
        const errorBox = document.getElementById("error-box");
        const toast = document.getElementById("toast");

        const visibleCount = document.getElementById("visible-count");
        const totalCount = document.getElementById("total-count");
        const serverCount = document.getElementById("server-count");
        const updated = document.getElementById("updated");

        const chips = document.getElementById("chips");


        /*
         * ============================================================
         * LOAD ALL SERVERS
         * ============================================================
         */

        async function loadRoutes() {
            loading.style.display = "block";
            routesTable.style.display = "none";
            empty.style.display = "none";
            refreshButton.classList.add("busy");

            errorBox.style.display = "none";
            errorBox.textContent = "";

            allRoutes = [];
            serverResults = [];

            renderServerStatus();

            const results = await Promise.all(
                SERVER_URLS.map(async (url) => {
                    try {
                        const response = await fetch(url, {
                            headers: {
                                "Accept": "application/json"
                            }
                        });

                        if (!response.ok) {
                            throw new Error(
                                `HTTP ${response.status} ${response.statusText}`
                            );
                        }

                        const data = await response.json();

                        return { url, ok: true, data };

                    } catch (error) {
                        return { url, ok: false, error: error.message };
                    }
                })
            );

            serverResults = results;

            for (const result of results) {
                if (!result.ok) {
                    continue;
                }

                allRoutes.push(...normalizeRoutes(result.data, result.url));
            }

            loading.style.display = "none";
            refreshButton.classList.remove("busy");
            updated.textContent = new Date().toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });

            renderServerStatus();
            renderRoutes();

            const failed = results.filter(result => !result.ok);

            if (failed.length > 0) {
                errorBox.style.display = "block";

                errorBox.textContent =
                    failed.length +
                    " server" +
                    (failed.length === 1 ? "" : "s") +
                    " could not be loaded: " +
                    failed.map(x => `${x.url} (${x.error})`).join(", ");
            }
        }


        /*
         * ============================================================
         * NORMALIZE JSON
         * ============================================================
         *
         * Your API returns:
         *
         * {
         *   "*": [ ... ],
         *   "ha.home": [ ... ],
         *   "home": [ ... ]
         * }
         *
         * This converts it into one flat array of routes.
         */

        function normalizeRoutes(data, sourceUrl) {
            const result = [];

            if (!data || typeof data !== "object") {
                return result;
            }

            // Extract hostname from the server's /routes URL.
            let sourceHostname = sourceUrl;

            try {
                sourceHostname = new URL(sourceUrl).hostname;
            } catch {
                // Keep sourceUrl if it isn't a valid URL.
            }

            for (const [serverName, routes] of Object.entries(data)) {

                if (!Array.isArray(routes)) {
                    continue;
                }

                for (const route of routes) {

                    if (!route || typeof route !== "object") {
                        continue;
                    }

                    // Ignore entries that don't actually define a route
                    // (e.g. static assets entries)
                    if (!route.route) {
                        continue;
                    }

                    // Replace "*" with the hostname of the server
                    // that supplied this /routes response.
                    const displayServer =
                        route.server === "*"
                            ? sourceHostname
                            : (route.server || serverName);

                    result.push({
                        server: displayServer,
                        route: route.route || "",
                        destination: route.destination || "",
                        match: route.match || "",
                        provider: route.provider || "",
                        ping: route.ping || "",
                        source: sourceUrl
                    });
                }
            }

            return result;
        }


        /*
         * ============================================================
         * FILTER + SORT
         * ============================================================
         */

        function filterRoutes(routes, query) {
            const q = query.trim().toLowerCase();

            return routes.filter(route => {

                if (activeSources.size && !activeSources.has(route.source)) {
                    return false;
                }

                if (!q) {
                    return true;
                }

                const searchable = [
                    route.server,
                    route.route,
                    route.destination,
                    route.match,
                    route.provider,
                    route.ping
                ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();

                return searchable.includes(q);
            });
        }

        function sortRoutes(routes) {
            if (!sortKey) {
                return routes;
            }

            return [...routes].sort((a, b) =>
                String(a[sortKey]).localeCompare(
                    String(b[sortKey]),
                    undefined,
                    { numeric: true, sensitivity: "base" }
                ) * sortDir
            );
        }

        function resetFilters() {
            searchInput.value = "";
            clearSearch.style.display = "none";
            activeSources.clear();
            renderServerStatus();
            renderRoutes();
        }


        /*
         * ============================================================
         * RENDER
         * ============================================================
         */

        function renderRoutes() {
            const filtered = sortRoutes(
                filterRoutes(allRoutes, searchInput.value)
            );

            routesBody.innerHTML = "";

            for (const route of filtered) {

                const row = document.createElement("tr");

                row.innerHTML = `
          <td>
            <span class="server">
              <span class="srv-dot" style="background:${colorFor(route.server)}"></span>
              ${hl(route.server)}
            </span>
          </td>

          <td>
            ${routeCell(route)}
          </td>

          <td>
            <span class="destination" data-copy="${escapeHtml(route.destination)}" title="Click to copy">${hl(route.destination)}</span>
          </td>

          <td>
            ${badge(route.match)}
          </td>

          <td>
            ${badge(route.provider)}
          </td>

          <td>
            <span class="ping" data-copy="${escapeHtml(route.ping)}" title="Click to copy">${hl(route.ping)}</span>
          </td>
        `;

                routesBody.appendChild(row);
            }

            visibleCount.textContent = filtered.length;

            const isLoading = loading.style.display !== "none";

            if (isLoading) {
                routesTable.style.display = "none";
                empty.style.display = "none";
            } else if (filtered.length === 0) {
                routesTable.style.display = "none";
                empty.style.display = "block";
            } else {
                routesTable.style.display = "table";
                empty.style.display = "none";
            }

            updateSortHeaders();
            updateStats();
        }

        function updateSortHeaders() {
            document.querySelectorAll("th[data-key]").forEach(th => {
                th.classList.remove("sorted-asc", "sorted-desc");

                if (th.dataset.key === sortKey) {
                    th.classList.add(sortDir === 1 ? "sorted-asc" : "sorted-desc");
                }
            });
        }


        /*
         * ============================================================
         * ROUTE LINKS
         * ============================================================
         *
         * "^/chat/(.*)" on server "helium"  ->  http://helium/chat/
         *
         * Only simple routes get a link. If anything regex-like is
         * left after removing "^" and a trailing "(.*)", the route
         * stays plain text.
         */

        function routeUrl(route) {
            const host = String(route.server || "");

            if (!/^[a-zA-Z0-9.-]+$/.test(host)) {
                return null;
            }

            let path = String(route.route || "")
                .replace(/^\^/, "")
                .replace(/\(\.\*\)$/, "");

            if (!path.startsWith("/") || /[()[\]{}*+?|\\$^]/.test(path)) {
                return null;
            }

            return `http://${host}${path}`;
        }

        function routeCell(route) {
            const url = routeUrl(route);

            if (!url) {
                return `<span class="route" data-copy="${escapeHtml(route.route)}" title="Click to copy">${hl(route.route)}</span>`;
            }

            return `<span class="route">` +
                `<a class="route-link" href="${escapeHtml(url)}" target="_blank" rel="noopener" title="Open ${escapeHtml(url)}">${hl(route.route)}</a>` +
                `<span class="copy-btn" data-copy="${escapeHtml(url)}" title="Copy ${escapeHtml(url)}">⧉</span>` +
                `</span>`;
        }


        /*
         * ============================================================
         * BADGES + HIGHLIGHT
         * ============================================================
         */

        function badge(value) {
            if (!value) {
                return "";
            }

            const className =
                String(value)
                    .toLowerCase()
                    .replace(/[^a-z0-9_-]/g, "");

            return `<span class="badge ${className}" data-filter="${escapeHtml(value)}" title="Filter by ${escapeHtml(value)}">${hl(value)}</span>`;
        }

        // Escapes a value and wraps search matches in <mark>.
        function hl(value) {
            const text = String(value ?? "");
            const q = searchInput.value.trim().toLowerCase();

            if (!q) {
                return escapeHtml(text);
            }

            const lower = text.toLowerCase();
            let out = "";
            let i = 0;
            let idx;

            while ((idx = lower.indexOf(q, i)) !== -1) {
                out += escapeHtml(text.slice(i, idx));
                out += "<mark>" + escapeHtml(text.slice(idx, idx + q.length)) + "</mark>";
                i = idx + q.length;
            }

            return out + escapeHtml(text.slice(i));
        }

        function colorFor(name) {
            let hash = 0;

            for (const ch of String(name)) {
                hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
            }

            return SERVER_COLORS[hash % SERVER_COLORS.length];
        }


        /*
         * ============================================================
         * SERVER STATUS (also acts as a server filter)
         * ============================================================
         */

        function renderServerStatus() {
            chips.querySelectorAll("li.server-pill").forEach(el => el.remove());

            // While loading, show placeholders for the configured servers.
            const items = serverResults.length
                ? serverResults
                : SERVER_URLS.map(url => ({ url, pending: true }));

            for (const result of items) {

                let host = result.url;

                try {
                    host = new URL(result.url).hostname;
                } catch {
                    // keep url
                }

                const pill = document.createElement("li");
                pill.className = "button button-nav server-pill";
                pill.dataset.url = result.url;

                let dotClass = "medium-load";
                let extra = "";
                let href = ' href="#"';

                if (result.pending) {
                    pill.classList.add("static");
                    pill.title = result.url;
                    href = "";
                } else if (result.ok) {
                    dotClass = "low-load";
                    const n = allRoutes.filter(r => r.source === result.url).length;
                    extra = `<span class="count">${n}</span>`;
                    pill.title = `${result.url} - click to filter`;

                    if (activeSources.has(result.url)) {
                        pill.classList.add("active");
                    }
                } else {
                    dotClass = "high-load";
                    extra = `<span class="count">offline</span>`;
                    pill.classList.add("offline");
                    pill.title = `${result.url} - ${result.error}`;
                    href = "";
                }

                pill.innerHTML = `<a${href}><span class="dot ${dotClass}"></span><span>${escapeHtml(host)}</span>${extra}</a>`;

                chips.appendChild(pill);
            }
        }

        chips.addEventListener("click", event => {
            const pill = event.target.closest("li.server-pill");

            if (!pill) {
                return;
            }

            event.preventDefault();

            if (pill.classList.contains("offline") || pill.classList.contains("static")) {
                return;
            }

            const url = pill.dataset.url;

            if (activeSources.has(url)) {
                activeSources.delete(url);
            } else {
                activeSources.add(url);
            }

            renderServerStatus();
            renderRoutes();
        });


        /*
         * ============================================================
         * STATS
         * ============================================================
         */

        function updateStats() {
            totalCount.textContent = allRoutes.length;

            const servers = new Set(
                allRoutes.map(route => route.server)
            );

            serverCount.textContent = servers.size;
        }


        /*
         * ============================================================
         * HTML ESCAPING
         * ============================================================
         *
         * Important because route data comes from HTTP.
         */

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /*
         * ============================================================
         * COPY + TOAST
         * ============================================================
         */

        let toastTimer;

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add("show");

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
        }

        async function copyText(text) {
            try {
                // Clipboard API needs https; the lab is plain http, so fall back.
                if (!navigator.clipboard || !window.isSecureContext) {
                    throw new Error("clipboard unavailable");
                }

                await navigator.clipboard.writeText(text);

            } catch {
                const area = document.createElement("textarea");
                area.value = text;
                area.style.position = "fixed";
                area.style.opacity = "0";
                document.body.appendChild(area);
                area.select();

                try {
                    document.execCommand("copy");
                } catch {
                    // nothing else to try
                }

                area.remove();
            }

            showToast("Copied: " + text);
        }

        routesBody.addEventListener("click", event => {
            const copyTarget = event.target.closest("[data-copy]");
            const filterTarget = event.target.closest("[data-filter]");

            if (filterTarget) {
                searchInput.value = filterTarget.dataset.filter;
                clearSearch.style.display = "block";
                renderRoutes();
                return;
            }

            if (copyTarget && copyTarget.dataset.copy) {
                copyText(copyTarget.dataset.copy);
            }
        });


        /*
         * ============================================================
         * SORT
         * ============================================================
         *
         * Click a header: ascending -> descending -> original order.
         */

        document.querySelectorAll("th[data-key]").forEach(th => {
            th.addEventListener("click", () => {
                const key = th.dataset.key;

                if (sortKey !== key) {
                    sortKey = key;
                    sortDir = 1;
                } else if (sortDir === 1) {
                    sortDir = -1;
                } else {
                    sortKey = null;
                    sortDir = 1;
                }

                renderRoutes();
            });
        });


        /*
         * ============================================================
         * SEARCH
         * ============================================================
         */

        let searchTimer;

        searchInput.addEventListener("input", () => {

            clearTimeout(searchTimer);

            clearSearch.style.display =
                searchInput.value ? "block" : "none";

            searchTimer = setTimeout(() => {
                renderRoutes();
            }, 80);
        });

        clearSearch.addEventListener("click", () => {
            searchInput.value = "";
            clearSearch.style.display = "none";
            searchInput.focus();
            renderRoutes();
        });

        resetButton.addEventListener("click", event => {
            event.preventDefault();
            resetFilters();
        });

        refreshButton.addEventListener("click", () => {
            loadRoutes();
        });

        /*
         * Keyboard shortcuts:
         *
         * Ctrl+K / Cmd+K -> focus search
         * Escape         -> clear search
         */

        document.addEventListener("keydown", event => {

            if (
                (event.ctrlKey || event.metaKey) &&
                event.key.toLowerCase() === "k"
            ) {
                event.preventDefault();
                searchInput.focus();
            }

            if (event.key === "Escape") {
                searchInput.value = "";
                clearSearch.style.display = "none";
                renderRoutes();
            }
        });


        /*
         * ============================================================
         * START
         * ============================================================
         */

        loadRoutes();
    </script>
</body>

</html>
