<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Explorer</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="tall">
        <h1>Route Explorer</h1>
        <div class="subtitle">Discover and search routes from all configured servers</div>
    </header>

    <main>
        <nav class="overhead">
            <ul id="chips">
                <li class="button button-nav home"><a href="/">Home</a></li>
                <li class="button button-nav static"><a><strong id="shown">0</strong><span
                            class="label">shown</span></a></li>
                <li class="button button-nav static"><a><strong id="total">0</strong><span
                            class="label">routes</span></a></li>
                <li class="button button-nav static"><a><strong id="hosts">0</strong><span
                            class="label">servers</span></a></li>
                <li class="button button-nav static"><a><span class="label">updated</span><strong
                            id="updated">&mdash;</strong></a></li>
                <!-- server filter chips are appended here by the script -->
            </ul>
        </nav>

        <div class="explorer">
            <div class="error-box" id="error-box" hidden></div>

            <div class="search-bar">
                <div class="search-wrapper">
                    <span class="search-icon">⌕</span>
                    <input id="search" type="search" autocomplete="off" spellcheck="false"
                        placeholder="Search routes, servers, IPs, ports, providers...">
                    <span class="kbd">Ctrl K</span>
                    <button id="clear-search" title="Clear search">×</button>
                </div>
                <button class="button refresh-action" id="refresh" title="Reload routes from all servers">
                    <span class="spin">↻</span> Refresh
                </button>
            </div>

            <div class="server-stats-container overfoot">
                <div class="server-stats table-card">
                    <table id="table" hidden>
                        <thead>
                            <tr>
                                <th data-key="server">Server</th>
                                <th data-key="route">Route</th>
                                <th data-key="destination">Destination</th>
                                <th data-key="match">Match</th>
                                <th data-key="provider">Provider</th>
                                <th data-key="ping">Ping</th>
                            </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>

                    <div class="error-message" id="empty" hidden>
                        <h2>No matching routes</h2>
                        <p>Try a different search term or server filter.</p>
                        <div class="centered-button-container">
                            <div class="button button-nav"><a href="#" id="reset">Clear filters</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 My HomeLab</p>
    </footer>

    <div class="toast" id="toast"></div>

    <script>
        const SERVERS = ["helium", "neon", "xenon"];
        const COLUMNS = ["server", "route", "destination", "match", "provider", "ping"];
        const routesUrl = server => `http://${server}/routes`;

        let routes = [];          // every route from every server
        let results = [];         // per server: { server, routes } or { server, error }
        let sortKey = null;       // header click: asc -> desc -> original order
        let sortDir = 1;
        const active = new Set(); // server filter chips; empty = all servers

        const $ = id => document.getElementById(id);
        const search = $("search"), chips = $("chips"), tbody = $("tbody");
        const table = $("table"), empty = $("empty"), errorBox = $("error-box");

        // ---------- load ----------

        async function loadServer(server) {
            try {
                const response = await fetch(routesUrl(server));
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json(); // { "<host>": [ {route, destination, ...} ], ... }
                const routes = Object.entries(data).flatMap(([key, list]) =>
                    list.filter(r => r.route).map(r => ({
                        source: server,
                        server: r.server === "*" ? server : r.server || key,
                        route: r.route,
                        destination: r.destination || "",
                        match: r.match || "",
                        provider: r.provider || "",
                        ping: r.ping || ""
                    })));
                return { server, routes };
            } catch (error) {
                return { server, error: error.message };
            }
        }

        async function load() {
            $("refresh").classList.add("busy");
            results = await Promise.all(SERVERS.map(loadServer));
            routes = results.flatMap(r => r.routes || []);

            const failed = results.filter(r => r.error);
            errorBox.hidden = !failed.length;
            errorBox.textContent = `${failed.length} server${failed.length === 1 ? "" : "s"} could not be loaded: ` +
                failed.map(r => `${routesUrl(r.server)} (${r.error})`).join(", ");

            $("updated").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
            $("refresh").classList.remove("busy");
            render();
        }

        // ---------- render ----------

        function render() {
            const q = search.value.trim().toLowerCase();
            const rows = routes.filter(r =>
                (!active.size || active.has(r.source)) &&
                (!q || COLUMNS.map(c => r[c]).join(" ").toLowerCase().includes(q)));

            if (sortKey) {
                rows.sort((a, b) => a[sortKey].localeCompare(b[sortKey], undefined, { numeric: true, sensitivity: "base" }) * sortDir);
            }

            tbody.innerHTML = rows.map(rowHtml).join("");
            table.hidden = !rows.length;
            empty.hidden = rows.length > 0 || !results.length;
            document.querySelectorAll("th").forEach(th => {
                th.className = th.dataset.key === sortKey ? (sortDir > 0 ? "sorted-asc" : "sorted-desc") : "";
            });

            $("shown").textContent = rows.length;
            $("total").textContent = routes.length;
            $("hosts").textContent = new Set(routes.map(r => r.server)).size;

            chips.querySelectorAll(".server-pill").forEach(el => el.remove());
            chips.insertAdjacentHTML("beforeend", results.map(pillHtml).join(""));
        }

        function rowHtml(r) {
            return `<tr>
        <td><span class="server">${hl(r.server)}</span></td>
        <td>${routeHtml(r)}</td>
        <td><span class="destination" data-copy="${esc(r.destination)}" title="Click to copy">${hl(r.destination)}</span></td>
        <td>${badge(r.match)}</td>
        <td>${badge(r.provider)}</td>
        <td><span class="ping" data-copy="${esc(r.ping)}" title="Click to copy">${hl(r.ping)}</span></td>
      </tr>`;
        }

        // "^/chat/(.*)" on helium -> http://helium/chat/. Anything still regex-like stays plain text.
        function routeHtml(r) {
            const path = r.route.replace(/^\^/, "").replace(/\(\.\*\)$/, "");
            const simple = /^[a-z0-9.-]+$/i.test(r.server) && path.startsWith("/") && !/[()[\]{}*+?|\\$^]/.test(path);
            if (!simple) {
                return `<span class="route" data-copy="${esc(r.route)}" title="Click to copy">${hl(r.route)}</span>`;
            }
            const url = `http://${r.server}${path}`;
            return `<span class="route"><a class="route-link" href="${esc(url)}" target="_blank" rel="noopener" title="Open ${esc(url)}">${hl(r.route)}</a>` +
                `<span class="copy-btn" data-copy="${esc(url)}" title="Copy ${esc(url)}">⧉</span></span>`;
        }

        function badge(value) {
            if (!value) return "";
            const cls = value.toLowerCase().replace(/[^a-z0-9_-]/g, "");
            return `<span class="badge ${cls}" data-filter="${esc(value)}" title="Filter by ${esc(value)}">${hl(value)}</span>`;
        }

        // Server chip: click to filter, offline servers show their error on hover.
        function pillHtml(r) {
            const url = routesUrl(r.server);
            if (r.error) {
                return `<li class="button button-nav server-pill offline" title="${esc(url)} - ${esc(r.error)}">` +
                    `<a><span class="dot high-load"></span><span>${r.server}</span><span class="count">offline</span></a></li>`;
            }
            return `<li class="button button-nav server-pill${active.has(r.server) ? " active" : ""}" data-server="${r.server}" title="${esc(url)} - click to filter">` +
                `<a href="#"><span class="dot low-load"></span><span>${r.server}</span><span class="count">${r.routes.length}</span></a></li>`;
        }

        // Escapes text and wraps search matches in <mark>.
        function hl(text) {
            const q = search.value.trim().toLowerCase();
            if (!q) return esc(text);
            const lower = text.toLowerCase();
            let out = "", i = 0, j;
            while ((j = lower.indexOf(q, i)) !== -1) {
                out += esc(text.slice(i, j)) + "<mark>" + esc(text.slice(j, j + q.length)) + "</mark>";
                i = j + q.length;
            }
            return out + esc(text.slice(i));
        }

        const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        // ---------- copy ----------

        let toastTimer;
        function copy(text) {
            // execCommand works on plain http, where navigator.clipboard is unavailable.
            const area = document.createElement("textarea");
            area.value = text;
            area.style.cssText = "position:fixed;opacity:0";
            document.body.append(area);
            area.select();
            document.execCommand("copy");
            area.remove();

            $("toast").textContent = "Copied: " + text;
            $("toast").classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => $("toast").classList.remove("show"), 1600);
        }

        // ---------- events ----------

        function clearSearch() {
            search.value = "";
            render();
        }

        search.oninput = render;
        $("refresh").onclick = load;
        $("clear-search").onclick = () => { clearSearch(); search.focus(); };
        $("reset").onclick = e => { e.preventDefault(); active.clear(); clearSearch(); };

        chips.onclick = e => {
            const pill = e.target.closest(".server-pill:not(.offline)");
            if (!pill) return;
            e.preventDefault();
            const server = pill.dataset.server;
            active.has(server) ? active.delete(server) : active.add(server);
            render();
        };

        tbody.onclick = e => {
            const filter = e.target.closest("[data-filter]");
            const copyTarget = e.target.closest("[data-copy]");
            if (filter) {
                search.value = filter.dataset.filter;
                render();
            } else if (copyTarget && copyTarget.dataset.copy) {
                copy(copyTarget.dataset.copy);
            }
        };

        document.querySelector("thead").onclick = e => {
            const key = e.target.dataset.key;
            if (!key) return;
            if (sortKey !== key) { sortKey = key; sortDir = 1; }
            else if (sortDir === 1) sortDir = -1;
            else sortKey = null;
            render();
        };

        document.onkeydown = e => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
                e.preventDefault();
                search.focus();
            } else if (e.key === "Escape") {
                clearSearch();
            }
        };

        load();
    </script>
</body>

</html>
