---
- name: Create reproxy directories
  file:
    path: /data/reproxy/web
    state: directory
    owner: "{{ autouser.name }}"
    group: "{{ autouser.name }}"
    mode: '0775'

- name: Copy web-site
  copy:
    src: .
    dest: /data/reproxy/
    owner: "{{ autouser.name }}"
    group: "{{ autouser.name }}"
    mode: '0664'
  notify: Restart reproxy

- name: Start a reproxy container
  docker_container:
    name: reproxy
    image: umputun/reproxy:master
    pull: always
    state: started
    restart_policy: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - /data/reproxy/config.yaml:/config.yaml
      - /data/reproxy/assets:/assets
      - /data/reproxy/web:/web
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env:
      DOCKER_API_VERSION: "1.40"
      TZ: "{{ timezone }}"
      MGMT_ENABLED: "true"
      MGMT_LISTEN: "127.0.0.1:8081"
      DOCKER_ENABLED: "true"
      DOCKER_AUTO: "true"
      ASSETS_LOCATION: /web
      ASSETS_NOT_FOUND: 404.html
      FILE_ENABLED: "true"
      FILE_NAME: "/config.yaml"
      DEBUG: "true"
      KEEP_HOST: "true"
      HEADER:
        Access-Control-Allow-Origin:*
      ERROR_ENABLED: "true"
      ERROR_TEMPLATE: "/assets/error.html"
      TIMEOUT_READ_HEADER: "120s"
      TIMEOUT_RESP_HEADER: "120s"
      MAX_SIZE: "16M"
    labels:
      reproxy.server: "{{ ansible_host }}"
  notify: Restart reproxy
